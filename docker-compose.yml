services:
  api:
    build: .
    env_file: .env
    environment:
      - ROLE=web
    ports:
      # Host 8000 matches start.cmd's dev port so frontend config pointing at
      # 127.0.0.1:8000 keeps working; container still listens on 10000
      # internally (Dockerfile's gunicorn --bind).
      - "8000:10000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      - ROLE=worker
    restart: unless-stopped
